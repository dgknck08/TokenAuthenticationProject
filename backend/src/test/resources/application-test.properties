# Veritabanını Testcontainers'taki PostgreSQL sağlar (AbstractIntegrationTest).
# Bağlantı bilgilerini @ServiceConnection otomatik verir; burada URL/kullanıcı yok.
# Bu projede temel tablolar (product, users, cart...) migration'la değil,
# Hibernate ddl-auto ile oluşuyor. Boş test container'ında V1'in dayanacağı
# temel şema olmadığı için testlerde şemayı Hibernate üretir, Flyway'i kapatırız.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false

# Hibernate şemayı kurduktan sonra V8'deki full-text search_vector kolonunu bir
# kez ekleriz (db/product-fts.sql), böylece gerçek arama sorgusu çalışır.
# defer-datasource-initialization bunun tablolar oluştuktan SONRA çalışmasını
# sağlar; başlangıçta yapınca (test sırasında değil) sorgu planı bozulmaz.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/product-fts.sql

# Kod tarafında default'u olmayan zorunlu değerler. Sadece test içindir.
app.jwtSecret=integration-test-jwt-signing-secret-key-that-is-long-enough-for-hs512-algorithm
app.jwtExpirationMs=3600000

# Test çıktısını sessiz tut.
logging.level.org.testcontainers=INFO
logging.level.org.springframework.test=WARN
